# خُطى — نسخة مهيّأة للنشر من لوحة Docker في Hostinger، بلا SSH.
#
# تختلف عن deploy/docker-compose.yml في أمرين فقط، وكلاهما لأن الخادم لا يملك
# نسخة من ملفات المشروع:
#   • الصورة تُبنى من مستودع Git مباشرة، فـ Docker يستنسخ ويبني على الخادم.
#   • الترحيل يعمل من داخل صورة التطبيق (scripts/migrate.js) بدل حقن ملفات
#     SQL في حاوية قاعدة البيانات.
#
# القيم المتغيّرة تُملأ في حقل environment داخل اللوحة، لا هنا.
# لا يُنشئ هذا الملف شبكة Traefik ولا يعدّلها؛ ينضمّ إلى القائمة فحسب، ولا يمسّ
# مشروع ticketing-system العامل على الخادم نفسه.

name: khuta

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: khuta
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: khuta
    volumes:
      - khuta_pgdata:/var/lib/postgresql/data
    networks: [khuta_internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U khuta -d khuta"]
      interval: 10s
      timeout: 5s
      retries: 12

  # يعمل مرة واحدة عند كل إقلاع: يطبّق ما لم يُطبَّق، ويخرج.
  migrate:
    build: &build
      context: ${SOURCE_REPO:?}
      dockerfile: deploy/Dockerfile
    image: khuta-app:latest
    restart: "no"
    depends_on:
      db: { condition: service_healthy }
    environment: &dbenv
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: khuta
      PGADMIN_USER: khuta
      PGADMIN_PASSWORD: ${POSTGRES_PASSWORD:?}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?}
    command: ["node", "scripts/migrate.js"]
    networks: [khuta_internal]

  app:
    build: *build
    image: khuta-app:latest
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    environment:
      <<: *dbenv
      PGUSER: khuta_app
      PGPASSWORD: ${APP_DB_PASSWORD:?}
      KHUTA_SECRET: ${KHUTA_SECRET:?}
      KHUTA_MFA_KEY: ${KHUTA_MFA_KEY:?}
      KHUTA_DEFAULT_TENANT: ${KHUTA_DEFAULT_TENANT:-alain}
    volumes:
      - khuta_media:/app/media
    networks: [khuta_internal, traefik]
    labels:
      traefik.enable: "true"
      traefik.docker.network: "${TRAEFIK_NETWORK:-traefik-proxy}"
      traefik.http.routers.khuta.rule: "Host(`${KHUTA_HOST:?}`)"
      traefik.http.routers.khuta.entrypoints: "websecure"
      traefik.http.routers.khuta.tls.certresolver: "${CERT_RESOLVER:-letsencrypt}"
      traefik.http.services.khuta.loadbalancer.server.port: "3100"
      traefik.http.routers.khuta.middlewares: "khuta-headers"
      traefik.http.middlewares.khuta-headers.headers.frameDeny: "true"
      traefik.http.middlewares.khuta-headers.headers.contentTypeNosniff: "true"
      traefik.http.middlewares.khuta-headers.headers.referrerPolicy: "same-origin"

volumes:
  khuta_pgdata:
  khuta_media:

networks:
  khuta_internal:
    internal: true
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik-proxy}
